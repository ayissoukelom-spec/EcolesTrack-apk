import java.util.Properties

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { stream ->
        releaseSigningProperties.load(stream)
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseTasksRequested = taskGraph.allTasks.any { task ->
        task.name.toLowerCase(Locale.ROOT).contains('release')
    }
    if (releaseTasksRequested) {
        def requiredProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        def missingProperties = requiredProperties.findAll {
            !releaseSigningProperties.getProperty(it)
        }
        if (!missingProperties.isEmpty()) {
            throw new GradleException(
                "Release signing requires ${missingProperties.join(', ')} in ${releaseSigningPropertiesFile}."
            )
        }

        def releaseKeystore = file(releaseSigningProperties.getProperty('storeFile'))
        if (!releaseKeystore.isFile()) {
            throw new GradleException("Release keystore does not exist: ${releaseKeystore}.")
        }
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace 'com.ecoletrack.webview'
    compileSdk 36

    defaultConfig {
        applicationId "com.ecoletrack.webview"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.0.3"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(releaseSigningProperties.getProperty('storeFile', 'release.keystore'))
            storePassword releaseSigningProperties.getProperty('storePassword', '')
            keyAlias releaseSigningProperties.getProperty('keyAlias', '')
            keyPassword releaseSigningProperties.getProperty('keyPassword', '')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
}

def webDistDir = file("${projectDir}/../../../dist")
def androidAssetsDir = file("${projectDir}/src/main/assets")

tasks.register('copyWebAssets', Copy) {
    group = 'build'
    description = 'Copies the latest web build into the Android assets folder'

    from(webDistDir) {
        include '**/*'
        exclude '**/*.map'
    }
    into(androidAssetsDir)

    onlyIf { webDistDir.exists() }

    doFirst {
        delete fileTree(androidAssetsDir) {
            include '**/*'
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyWebAssets')
}
