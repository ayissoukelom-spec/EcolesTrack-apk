plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace 'com.ecoletrack.webview'
    compileSdk 36

    defaultConfig {
        applicationId "com.ecoletrack.webview"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
    storeFile file('release.keystore')
    storePassword 'KpK@@##@@##228'
    keyAlias 'ecoletrack'
    keyPassword 'KpK@@##@@##228'
}
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
}

def webDistDir = file("${projectDir}/../../../dist")
def androidAssetsDir = file("${projectDir}/src/main/assets")

tasks.register('copyWebAssets', Copy) {
    group = 'build'
    description = 'Copies the latest web build into the Android assets folder'

    from(webDistDir) {
        include '**/*'
        exclude '**/*.map'
    }
    into(androidAssetsDir)

    onlyIf { webDistDir.exists() }

    doFirst {
        delete fileTree(androidAssetsDir) {
            include '**/*'
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyWebAssets')
}